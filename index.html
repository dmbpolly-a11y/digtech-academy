<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digtech Academy — Skills that pay</title>
    <meta name="description" content="Uganda's leading online academy for in-demand tech skills, live classes, and verifiable certificates. Pay in UGX with PesaPal." />
    <link rel="icon" type="image/png" href="/digitechlogo.png" />
    
    <!-- Landbot AI Agent Livechat -->
    <script SameSite="None; Secure" src="https://cdn.landbot.io/landbot-3/landbot-3.0.0.js"></script>
    <script>
      function initLandbot() {
        if (window.myLandbot) return;
        if (typeof Landbot !== 'undefined' && Landbot.Livechat) {
          window.myLandbot = new Landbot.Livechat({
            configUrl: 'https://storage.googleapis.com/landbot.site/v3/H-3496800-WG83CBLMRS36PSAX/index.json',
            customData: {
              avatar: '/images/chatbot.png'
            }
          });
        }
      }

      // Initialize on load and on first user interaction
      window.addEventListener('load', initLandbot);
      window.addEventListener('mouseover', initLandbot, { once: true });
      window.addEventListener('touchstart', initLandbot, { once: true });
    </script>
    
    <!-- High-visibility styling for AI Agent widget on website & mobile -->
    <style>
      /* ─── AI Agent Widget: Ultra-Visible & Mobile-Friendly ────────── */
      [class*="LandbotLivechat"],
      [class*="landbot"],
      [class*="Landbot"] {
        z-index: 999999 !important;
      }

      /* Floating launcher visibility */
      .landbot-container__button,
      #landbot-button,
      [class*="landbot"] button,
      [class*="Landbot"] button {
        background-image: url('/images/chatbot.png') !important;
        background-size: cover !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
        background-color: #1A4095 !important;
        border: 3px solid #28C0F4 !important;
        border-radius: 50% !important;
        box-shadow: 0 8px 30px rgba(40, 192, 244, 0.5), 0 4px 15px rgba(26, 64, 149, 0.4) !important;
        width: 60px !important;
        height: 60px !important;
        cursor: pointer !important;
        transition: transform 0.2s ease, box-shadow 0.2s ease !important;
      }

      .landbot-container__button:hover,
      #landbot-button:hover,
      [class*="landbot"] button:hover,
      [class*="Landbot"] button:hover {
        transform: scale(1.08) !important;
        box-shadow: 0 12px 35px rgba(40, 192, 244, 0.7), 0 6px 20px rgba(26, 64, 149, 0.5) !important;
      }

      /* Hide any default svg text inside the button to cleanly show chatbot.png */
      .landbot-container__button svg,
      #landbot-button svg,
      [class*="landbot"] button svg,
      [class*="Landbot"] button svg {
        opacity: 0 !important;
      }

      /* Mobile adjustment: ensure it doesn't get covered by mobile bottom bars */
      @media (max-width: 768px) {
        .landbot-container__button,
        #landbot-button,
        [class*="landbot"] button,
        [class*="Landbot"] button {
          width: 54px !important;
          height: 54px !important;
        }
      }
    </style>
  </body>
</html>
